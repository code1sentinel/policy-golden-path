[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policygp"
version = "0.9.0"
description = "PolicyGP (Policy Golden Path), the golden path for policy development: follow policy intent through controls, implementation, risk and recommendation, with health checks and best-practice guides for each OSCAL statement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/code1sentinel/policy-golden-path"
Issues = "https://github.com/code1sentinel/policy-golden-path/issues"

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8", "openpyxl>=3.1"]  # openpyxl only to test reading real-world workbooks

[project.scripts]
policygp = "policygp.cli:main"
policygp-web = "policygp.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policygp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
