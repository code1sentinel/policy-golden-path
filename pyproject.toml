[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscal-assess"
version = "0.1.0"
description = "Score OSCAL control implementation statements and pass the ones that reach a confidence threshold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
oscal-assess = "oscal_assess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
