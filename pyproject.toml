[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codify"
version = "1.0.0"
description = "Codify: turn legacy policy clauses into OSCAL control statements, IM8 style, with checks and an OSCAL catalog as the save file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/code1sentinel/policy-golden-path"
Issues = "https://github.com/code1sentinel/policy-golden-path/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]  # openpyxl only to test reading real-world workbooks

[project.scripts]
codify = "codify.cli:main"
codify-web = "codify.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codify = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
