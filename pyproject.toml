[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-hygiene-portal"
version = "0.3.0"
description = "Control Hygiene Portal: health checks for OSCAL implementation statements, risk statements and recommendations, with best-practice guides and areas for improvement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
chp = "control_hygiene.cli:main"
chp-web = "control_hygiene.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_hygiene = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
