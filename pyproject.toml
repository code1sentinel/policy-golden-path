[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-golden-path"
version = "0.5.0"
description = "Policy Golden Path, the golden path for policy engineering: follow policy intent through controls, implementation, risk and recommendation, with health checks and best-practice guides for each OSCAL statement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/code1sentinel/policy-golden-path"
Issues = "https://github.com/code1sentinel/policy-golden-path/issues"

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
policy-path = "policy_golden_path.cli:main"
policy-path-web = "policy_golden_path.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy_golden_path = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
