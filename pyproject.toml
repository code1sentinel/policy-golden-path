[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-path"
version = "0.4.0"
description = "Golden Path: follow policy intent through controls, implementation, risk and recommendation, with health checks and best-practice guides for each OSCAL statement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
golden-path = "golden_path.cli:main"
golden-path-web = "golden_path.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golden_path = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
