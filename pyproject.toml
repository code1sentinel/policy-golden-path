[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitals"
version = "0.20.0"
description = "Vitals: vital signs for your controls. Follow policy intent through controls, risk and recommendation, with health checks and best-practice guides for each OSCAL statement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/code1sentinel/policy-golden-path"
Issues = "https://github.com/code1sentinel/policy-golden-path/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]  # openpyxl only to test reading real-world workbooks

[project.scripts]
vitals = "vitals.cli:main"
vitals-web = "vitals.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitals = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
