name: oscal-assess

on:
  push:
    paths: ["oscal-assess/**", ".github/workflows/oscal-assess.yml"]
  pull_request:
    paths: ["oscal-assess/**", ".github/workflows/oscal-assess.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oscal-assess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The example component definition contains a deliberately weak statement,
      # so this step shows the report without failing the build.
      - run: oscal-assess examples/component-definition-example.json -c examples/catalog-excerpt.json --no-fail
      - run: oscal-assess examples/ssp-example.json -c examples/catalog-excerpt.json -p examples/policy-example.json --no-fail
