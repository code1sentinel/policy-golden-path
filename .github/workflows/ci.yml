name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: vitals examples/component-definition-example.json -c examples/catalog-excerpt.json
      - run: vitals examples/ssp-example.json -c examples/catalog-excerpt.json -p examples/policy-example.json
      - run: vitals examples/assessment-results-example.json
      - run: vitals examples/risk-register-example.csv
