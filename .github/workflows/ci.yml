name: CI

on:
  push:
  pull_request:

env:
  OSCAL_VERSION: "1.1.2"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: codify examples/acme-information-security-policy-2016.docx
      - run: codify examples/acme-information-security-policy-2016.md -f report

  oscal-schema:
    # The catalog Codify writes must be valid OSCAL, checked against NIST's own schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - name: Write catalogs
        run: |
          mkdir -p out
          codify examples/acme-information-security-policy-2016.md -f oscal -o out/acme-md.json
          codify examples/acme-information-security-policy-2016.docx -f oscal -o out/acme-docx.json
          codify out/acme-md.json -f oscal -o out/acme-reopened.json
          # with IM8 Reform mappings: each control mapped to its top suggestion
          python -c "import json; from codify import api, im8; from codify.project import to_oscal
          p = api.call({'action': 'open', 'name': 'a.md', 'content': open('examples/acme-information-security-policy-2016.md').read()})['project']
          for c in p['controls']: c['im8'] = [s['id'] for s in im8.suggest(c['text'])[:1]]
          json.dump(to_oscal(p), open('out/acme-im8.json', 'w'))"
      - name: Validate against the OSCAL ${{ env.OSCAL_VERSION }} catalog schema
        run: |
          curl -sSLf -o out/schema.json \
            "https://github.com/usnistgov/OSCAL/releases/download/v${OSCAL_VERSION}/oscal_catalog_schema.json"
          npm install --no-save --silent ajv@8 ajv-formats@3
          node scripts/validate_oscal.mjs out/schema.json out/acme-md.json out/acme-docx.json out/acme-reopened.json out/acme-im8.json
