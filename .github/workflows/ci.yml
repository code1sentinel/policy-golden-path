name: policy-golden-path

on:
  push:
    paths: ["policy-golden-path/**", ".github/workflows/policy-golden-path.yml"]
  pull_request:
    paths: ["policy-golden-path/**", ".github/workflows/policy-golden-path.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-golden-path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: policy-path examples/component-definition-example.json -c examples/catalog-excerpt.json
      - run: policy-path examples/ssp-example.json -c examples/catalog-excerpt.json -p examples/policy-example.json
      - run: policy-path examples/assessment-results-example.json
