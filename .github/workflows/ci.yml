name: CI

on:
  push:
  pull_request:

env:
  OSCAL_VERSION: "1.1.2"
  PYODIDE_VERSION: "314.0.7"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: codify examples/acme-information-security-policy-2016.docx
      - run: codify examples/acme-information-security-policy-2016.md -f report

  e2e:
    # The web app in a real browser: as codify-web serves it, and as the browser-only site (Pyodide).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [server, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - name: Build the site with Pyodide ${{ env.PYODIDE_VERSION }}
        if: matrix.mode == 'site'
        run: |
          npm pack "pyodide@${PYODIDE_VERSION}" --silent
          tar xzf "pyodide-${PYODIDE_VERSION}.tgz"
          python scripts/build_site.py --pyodide package --out site
          echo "CODIFY_SITE=$PWD/site" >> "$GITHUB_ENV"
      - run: pytest -q tests/e2e

  oscal-schema:
    # The catalog Codify writes must be valid OSCAL, checked against NIST's own schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - name: Write catalogs
        run: |
          mkdir -p out
          codify examples/acme-information-security-policy-2016.md -f oscal -o out/acme-md.json
          codify examples/acme-information-security-policy-2016.docx -f oscal -o out/acme-docx.json
          codify out/acme-md.json -f oscal -o out/acme-reopened.json
          codify examples/acme-information-security-policy-2016.md --risks examples/acme-risk-register.csv \
            -f oscal -o out/acme-mixed.json
      - name: Validate against the OSCAL ${{ env.OSCAL_VERSION }} catalog schema
        run: |
          curl -sSLf -o out/schema.json \
            "https://github.com/usnistgov/OSCAL/releases/download/v${OSCAL_VERSION}/oscal_catalog_schema.json"
          npm install --no-save --silent ajv@8 ajv-formats@3
          node scripts/validate_oscal.mjs out/schema.json \
            out/acme-md.json out/acme-docx.json out/acme-reopened.json \
            out/acme-mixed.json tests/goldens/risk-only.json tests/goldens/mixed-clause-risk.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Audit installed dependencies
        # setup-python gives a clean env; --skip-editable skips this repo (not on PyPI).
        run: pip-audit --skip-editable
      - name: Install gitleaks
        run: |
          curl -sSLf -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml
