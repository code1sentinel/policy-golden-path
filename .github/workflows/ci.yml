name: golden-path

on:
  push:
    paths: ["golden-path/**", ".github/workflows/golden-path.yml"]
  pull_request:
    paths: ["golden-path/**", ".github/workflows/golden-path.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golden-path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: golden-path examples/component-definition-example.json -c examples/catalog-excerpt.json
      - run: golden-path examples/ssp-example.json -c examples/catalog-excerpt.json -p examples/policy-example.json
      - run: golden-path examples/assessment-results-example.json
