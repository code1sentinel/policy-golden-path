name: control-hygiene-portal

on:
  push:
    paths: ["control-hygiene-portal/**", ".github/workflows/control-hygiene-portal.yml"]
  pull_request:
    paths: ["control-hygiene-portal/**", ".github/workflows/control-hygiene-portal.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-hygiene-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: chp examples/component-definition-example.json -c examples/catalog-excerpt.json
      - run: chp examples/ssp-example.json -c examples/catalog-excerpt.json -p examples/policy-example.json
      - run: chp examples/assessment-results-example.json
