name: Pages

# Builds the browser-only site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYODIDE_VERSION: "314.0.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Pyodide ${{ env.PYODIDE_VERSION }}
        # npm verifies the package's registry integrity hash on download.
        run: |
          npm pack "pyodide@${PYODIDE_VERSION}" --silent
          tar xzf "pyodide-${PYODIDE_VERSION}.tgz"
      - name: Build the site
        run: python scripts/build_site.py --pyodide package --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
